# DevOpt / Agent Project Framework — configuration
# Sourced by scripts. Keep values shell-safe (no spaces around =).

FRAMEWORK_NAME="DevOpt"
FRAMEWORK_VERSION="1.4.1"

# Context budgets (enforced by scripts/token-audit.sh --strict and doctor.sh)
AGENTS_MAX_LINES=140
SKILL_MAX_LINES=200
DOC_MAX_LINES=500
BASELINE_MAX_TOKENS=3500
SKILL_DESC_MAX_CHARS=400

# Adapters generated by scripts/sync-adapters.sh
ADAPTERS="claude opencode cursor copilot gemini windsurf roo zed aider junie"

# Project layout
PROJECT_DIR="project"
DOCS_DIR="docs"
SKILLS_DIR=".agents/skills"
TEMPLATES_DIR=".agents/templates"
PROFILES_DIR=".agents/profiles"
PACKS_DIR=".agents/packs"

# Git model: promotion (4 long-lived tracks) or trunk (main + short-lived only)
GIT_MODEL=promotion

# Stack profiles (filenames under PROFILES_DIR, without .md)
FRONTEND_PROFILE=web-react-vite-netlify
BACKEND_PROFILE=api-node-nest
# BACKEND_PROFILE=api-python        # FastAPI
# BACKEND_PROFILE=api-node-nest     # NestJS

# Product layout for bootstrapped apps
LAYOUT=split-apps
WEB_DIR=frontend
API_DIR=backend

# Long-lived branches (GIT_MODEL=promotion)
BRANCH_MAIN=main
BRANCH_DEV_FRONTEND=dev/frontend
BRANCH_DEV_BACKEND=dev/backend
BRANCH_PROD_FRONTEND=prod/frontend
BRANCH_PROD_BACKEND=prod/backend
